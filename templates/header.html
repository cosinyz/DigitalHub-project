{% load static %}
<header class="header">
  <div class="container header__inner">
    <a href="{% url 'pages:home' %}" class="logo">
      {% if company_info and company_info.logo %}
        <img src="{{ company_info.logo.url }}" alt="{{ company_info.name }}">
      {% else %}
        <img src="{% static 'img/logo.svg' %}" alt="{{ company_info.name|default:'DigitalHub' }}">
      {% endif %}
      <span>{{ company_info.name|default:'DigitalHub' }}</span>
    </a>
    <nav class="nav">
      <ul class="nav__list">
        <li><a href="{% url 'pages:home' %}" class="nav__link">Главная</a></li>
        <li><a href="{% url 'pages:about' %}" class="nav__link">О проекте</a></li>
        <li><a href="{% url 'pages:services' %}" class="nav__link">Услуги</a></li>
        <li><a href="{% url 'pages:contacts' %}" class="nav__link">Контакты</a></li>
      </ul>
      <a href="{% url 'pages:contacts' %}" class="btn btn-primary">Связаться</a>
    </nav>
    <button class="burger" type="button" aria-label="Меню" aria-expanded="false"><span></span><span></span><span></span></button>
  </div>
</header>
